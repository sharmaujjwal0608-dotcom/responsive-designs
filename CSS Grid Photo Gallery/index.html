<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1 class="gallery-title">Our Portfolio</h1>

  <div class="gallery">

    <div class="gallery-card">
      <img src="https://picsum.photos/seed/mountain/600/400" alt="Mountain" class="card-image">
      <div class="card-caption">Mountain Sunrise</div>
    </div>

    <div class="gallery-card">
      <img src="https://picsum.photos/seed/ocean/600/400" alt="Ocean" class="card-image">
      <div class="card-caption">Ocean Waves</div>
    </div>

    <div class="gallery-card">
      <img src="https://picsum.photos/seed/forest/600/400" alt="Forest" class="card-image">
      <div class="card-caption">Forest Trail</div>
    </div>

    <div class="gallery-card">
      <img src="https://picsum.photos/seed/cityscape/600/400" alt="City" class="card-image">
      <div class="card-caption">City Lights</div>
    </div>

    <div class="gallery-card">
      <img src="https://picsum.photos/seed/desert/600/400" alt="Desert" class="card-image">
      <div class="card-caption">Desert Dunes</div>
    </div>

    <div class="gallery-card">
      <img src="https://picsum.photos/seed/waterfall/600/400" alt="Waterfall" class="card-image">
      <div class="card-caption">Hidden Waterfall</div>
    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
