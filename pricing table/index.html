<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Table</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="pricing">

    <div class="plan">
      <h2 class="plan-name">Basic</h2>
      <div class="plan-price">$9<span class="plan-period">/mo</span></div>
      <ul class="plan-features">
        <li>5 Projects</li>
        <li>10GB Storage</li>
        <li>Email Support</li>
      </ul>
      <button class="plan-btn">Get Started</button>
    </div>

    <div class="plan featured">
      <h2 class="plan-name">Pro</h2>
      <div class="plan-price">$29<span class="plan-period">/mo</span></div>
      <ul class="plan-features">
        <li>Unlimited Projects</li>
        <li>100GB Storage</li>
        <li>Priority Support</li>
        <li>Custom Domain</li>
      </ul>
      <button class="plan-btn">Get Started</button>
    </div>

    <div class="plan">
      <h2 class="plan-name">Enterprise</h2>
      <div class="plan-price">$99<span class="plan-period">/mo</span></div>
      <ul class="plan-features">
        <li>Unlimited Everything</li>
        <li>1TB Storage</li>
        <li>24/7 Phone Support</li>
        <li>SLA Guarantee</li>
      </ul>
      <button class="plan-btn">Get Started</button>
    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
