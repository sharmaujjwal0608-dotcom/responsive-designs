<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page-wrapper">
    <div class="notification-card">
      <div class="notification-icon">&#128276;</div>
      <h2 class="notification-title">Update Available</h2>
      <p class="notification-body">
        A new version of the dashboard is ready to install. Update now to access the latest features and performance enhancements.
      </p>
      <button class="notification-btn">Update Now</button>
    </div>
  </main>

</body>
</html>
