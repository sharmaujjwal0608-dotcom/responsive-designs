<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="card">

    <div class="card-header">
      <img
        src="https://px.pixxo.io/images/rio/1.jpeg"
        alt="Avatar"
        class="avatar"
      >
    </div>

    <div class="card-body">

      <h1 class="name">Dogesh Bhai</h1>

      <p class="role">Senior Product Designer</p>

      <div class="divider"></div>

      <div class="stats">

        <div class="stat">
          <span class="stat-number">248</span>
          <span class="stat-label">Posts</span>
        </div>

        <div class="stat">
          <span class="stat-number">12.4K</span>
          <span class="stat-label">Followers</span>
        </div>

        <div class="stat">
          <span class="stat-number">536</span>
          <span class="stat-label">Following</span>
        </div>

      </div>

      <button class="follow-btn">Follow</button>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
